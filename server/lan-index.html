<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nile Food - Hotel Dining</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .bg {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.15) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 50%, rgba(139,92,246,0.1) 0%, transparent 60%);
      z-index: 0;
    }
    .content { position: relative; z-index: 1; text-align: center; padding: 2rem; max-width: 600px; }
    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 800;
      background: linear-gradient(135deg, #818cf8, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
    .subtitle { color: rgba(255,255,255,0.5); font-size: clamp(0.9rem, 2vw, 1.1rem); margin-bottom: 2.5rem; }
    .cards { display: flex; flex-direction: column; gap: 1rem; }
    @media (min-width: 480px) { .cards { flex-direction: row; } }
    .card {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 1.5rem;
      padding: 1.5rem;
      text-decoration: none;
      color: #fff;
      transition: all 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }
    .card:hover { background: rgba(255,255,255,0.1); border-color: rgba(99,102,241,0.5); transform: translateY(-2px); }
    .card:active { transform: scale(0.97); }
    .card .icon { font-size: 2rem; }
    .card .label { font-weight: 700; font-size: 1.1rem; }
    .card .desc { color: rgba(255,255,255,0.4); font-size: 0.85rem; }
    .card.primary { background: rgba(99,102,241,0.2); border-color: rgba(99,102,241,0.4); }
    .card.primary:hover { background: rgba(99,102,241,0.3); }
    .footer { margin-top: 2.5rem; color: rgba(255,255,255,0.2); font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="content">
    <h1>Nile Food</h1>
    <p class="subtitle">Premium Hotel Dining Experience</p>
    <div class="cards">
      <a href="/kiosk" class="card primary">
        <div class="icon">🍽️</div>
        <div class="label">Browse Menu</div>
        <div class="desc">Order food from your table</div>
      </a>
      <a href="/menu" class="card">
        <div class="icon">📋</div>
        <div class="label">Full Menu</div>
        <div class="desc">Complete restaurant menu</div>
      </a>
      <a href="/admin" class="card">
        <div class="icon">⚙️</div>
        <div class="label">Admin Panel</div>
        <div class="desc">Manage orders &amp; kitchen</div>
      </a>
    </div>
    <div class="footer">Connected via hotel LAN &middot; All orders are processed locally</div>
  </div>
</body>
</html>
